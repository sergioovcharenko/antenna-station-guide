<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Навчальна панель</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:grid;place-items:center;padding:28px;
  background:radial-gradient(circle at 50% 0,#343941 0,#20242a 46%,#14171b 100%);
  color:#fff
}
.wrap{width:min(980px,100%);text-align:center}
h1{font-size:clamp(30px,5vw,54px);margin:0 0 12px;letter-spacing:.02em}
.sub{font-size:clamp(16px,2vw,21px);color:#aeb5bd;margin-bottom:42px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.card{
  min-height:330px;border-radius:30px;text-decoration:none;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.055);
  box-shadow:0 22px 60px rgba(0,0,0,.28);
  transition:.2s ease;overflow:hidden;position:relative
}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 55%);pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-7px);border-color:rgba(255,255,255,.3);box-shadow:0 30px 70px rgba(0,0,0,.36)}
.icon{
  width:150px;height:150px;border-radius:34px;display:grid;place-items:center;
  font-weight:900;font-size:66px;letter-spacing:-.04em;margin-bottom:26px
}
.as .icon{background:#ef6035;box-shadow:0 18px 45px rgba(239,96,53,.27)}
.q .icon{background:#3478f6;box-shadow:0 18px 45px rgba(52,120,246,.27)}
.name{font-size:28px;font-weight:800}
.desc{font-size:17px;color:#adb5be;margin-top:9px}
@media(max-width:700px){
  body{padding:18px}.grid{grid-template-columns:1fr;gap:16px}.card{min-height:230px;border-radius:24px}
  .icon{width:112px;height:112px;border-radius:27px;font-size:50px;margin-bottom:18px}
  h1{margin-top:8px}.sub{margin-bottom:24px}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Оберіть розділ</h1>
  <div class="sub">Що потрібно відкрити?</div>
  <div class="grid">
    <a class="card as" href="antenna.html">
      <div class="icon">АС</div>
      <div class="name">Антенна станція</div>
      <div class="desc">Інтерактивна панель та налаштування</div>
    </a>
    <a class="card q" href="qground.html">
      <div class="icon">Q</div>
      <div class="name">QGround</div>
      <div class="desc">Інтерактивна інструкція інтерфейсу</div>
    </a>
  </div>
</main>
</body>
</html>
