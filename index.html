<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Навчальні матеріали</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f5f7;
  --card:#ffffff;
  --text:#252a30;
  --muted:#7b858f;
  --border:#e1e6ea;
  --accent:#ef5b25;
}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.wrap{width:min(930px,100%);text-align:center}
h1{font-size:38px;margin:0 0 10px;font-weight:800}
.subtitle{font-size:19px;color:var(--muted);margin-bottom:38px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.tile{
  aspect-ratio:1/1;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:34px;
  box-shadow:0 10px 30px rgba(26,32,40,.06);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  position:relative;
  overflow:hidden;
}
.tile::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 22%,rgba(239,91,37,.12),transparent 52%);
  opacity:0;
  transition:opacity .2s ease;
}
.tile:hover,.tile:focus-visible{
  transform:translateY(-5px);
  border-color:#efb49f;
  box-shadow:0 18px 42px rgba(26,32,40,.13),0 0 0 4px rgba(239,91,37,.08);
  outline:none;
}
.tile:hover::before,.tile:focus-visible::before{opacity:1}
.icon{
  width:112px;height:112px;border-radius:27px;
  display:grid;place-items:center;
  background:#fff2ed;color:var(--accent);
  font-size:54px;font-weight:900;
  margin-bottom:28px;
  position:relative;z-index:1;
}
.title{font-size:28px;font-weight:800;position:relative;z-index:1}
.desc{margin-top:10px;font-size:16px;color:var(--muted);line-height:1.4;position:relative;z-index:1;max-width:310px}
.arrow{position:absolute;right:25px;bottom:22px;color:var(--accent);font-size:29px;font-weight:800}
@media(max-width:700px){
  body{padding:20px}
  .grid{grid-template-columns:1fr;max-width:430px;margin:0 auto}
  h1{font-size:30px}
  .subtitle{font-size:17px;margin-bottom:26px}
  .tile{aspect-ratio:auto;min-height:290px}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Оберіть розділ</h1>
  <div class="subtitle">Що потрібно переглянути?</div>
  <div class="grid">
    <a class="tile" href="antenna.html">
      <div class="icon">⌁</div>
      <div class="title">Антенна станція</div>
      <div class="desc">Інтерактивна інструкція та налаштування антенної станції</div>
      <div class="arrow">→</div>
    </a>
    <a class="tile" href="qground.html">
      <div class="icon">✥</div>
      <div class="title">QGROUND</div>
      <div class="desc">Інтерактивна схема інтерфейсу з підказками по елементах</div>
      <div class="arrow">→</div>
    </a>
  </div>
</main>
</body>
</html>
